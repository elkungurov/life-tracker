<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход — Life Tracker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-page:#0f0f1a;
  --bg-card:#1a1a2e;
  --border:#2a2a4a;
  --text:#e8e8e8;
  --text-secondary:#8888aa;
  --accent:#4ecca3;
  --purple:#7c5cbf;
  --err:#ff6b6b;
  --radius:12px;
  --radius-sm:8px;
}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  background:var(--bg-page);color:var(--text);
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
}
.card{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:var(--radius);padding:32px;width:100%;max-width:380px;
}
h1{
  text-align:center;font-size:1.6rem;margin-bottom:4px;
  background:linear-gradient(135deg,var(--accent),var(--purple));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.sub{text-align:center;font-size:0.8rem;color:var(--text-secondary);margin-bottom:24px}
label{display:block;font-size:0.8rem;color:var(--text-secondary);margin-bottom:4px;margin-top:14px}
label:first-of-type{margin-top:0}
input{
  width:100%;padding:10px 12px;background:var(--bg-page);
  border:1px solid var(--border);border-radius:var(--radius-sm);
  color:var(--text);font-size:0.9rem;outline:none;
  transition:border-color .2s;font-family:inherit;
}
input:focus{border-color:var(--accent)}
.btn{
  width:100%;padding:12px;border-radius:var(--radius-sm);
  border:1px solid var(--accent);background:transparent;
  color:var(--accent);font-size:0.95rem;cursor:pointer;
  transition:all .2s;font-family:inherit;font-weight:600;margin-top:20px;
}
.btn:hover{background:rgba(78,204,163,.1)}
.btn:disabled{opacity:.5;cursor:default}
.err{color:var(--err);font-size:0.8rem;text-align:center;margin-top:10px;min-height:1.2em}
.toggle{text-align:center;font-size:0.8rem;color:var(--text-secondary);margin-top:16px;cursor:pointer}
.toggle:hover{color:var(--accent)}
</style>
</head>
<body>
<div class="card">
  <h1>Life Tracker</h1>
  <p class="sub" id="subtitle">Войдите или зарегистрируйтесь</p>
  <form id="auth-form">
    <label>Email</label>
    <input id="email" type="email" placeholder="your@email.com" autocomplete="email">
    <label>Пароль</label>
    <input id="password" type="password" placeholder="не менее 6 символов" autocomplete="current-password">
    <button class="btn" id="submit-btn" type="submit">Войти</button>
    <div class="err" id="error-msg"></div>
  </form>
  <div class="toggle" id="toggle-mode">Нет аккаунта? Зарегистрироваться</div>
</div>
<script>
let isLogin = true;
const form = document.getElementById('auth-form');
const email = document.getElementById('email');
const password = document.getElementById('password');
const submitBtn = document.getElementById('submit-btn');
const errorMsg = document.getElementById('error-msg');
const toggle = document.getElementById('toggle-mode');
const subtitle = document.getElementById('subtitle');

toggle.addEventListener('click', () => {
  isLogin = !isLogin;
  subtitle.textContent = isLogin ? 'Войдите или зарегистрируйтесь' : 'Создайте аккаунт';
  submitBtn.textContent = isLogin ? 'Войти' : 'Зарегистрироваться';
  toggle.textContent = isLogin ? 'Нет аккаунта? Зарегистрироваться' : 'Уже есть аккаунт? Войти';
  errorMsg.textContent = '';
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const emailVal = email.value.trim();
  const passVal = password.value;
  if (!emailVal || !passVal) { errorMsg.textContent = 'Заполните все поля'; return; }
  if (passVal.length < 6) { errorMsg.textContent = 'Пароль минимум 6 символов'; return; }
  submitBtn.disabled = true;
  submitBtn.textContent = 'Загрузка...';
  errorMsg.textContent = '';
  try {
    const res = await fetch('/api/' + (isLogin ? 'login' : 'register'), {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ email: emailVal, password: passVal })
    });
    const data = await res.json();
    if (!res.ok) { errorMsg.textContent = data.error || 'Ошибка'; return; }
    localStorage.setItem('token', data.token);
    window.location.href = '/';
  } catch(e) {
    errorMsg.textContent = 'Ошибка соединения';
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = isLogin ? 'Войти' : 'Зарегистрироваться';
  }
});
</script>
</body>
</html>
