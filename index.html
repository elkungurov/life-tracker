<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Life Tracker</title>
<link rel="manifest" href="/manifest.json">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-page:#0f0f1a;
  --bg-card:#1a1a2e;
  --border:#2a2a4a;
  --text:#e8e8e8;
  --text-secondary:#8888aa;
  --accent:#4ecca3;
  --purple:#7c5cbf;
  --radius:16px;
  --radius-sm:10px;
}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  background:var(--bg-page);color:var(--text);
  min-height:100vh;display:flex;justify-content:center;padding:20px;
}
#app{width:100%;max-width:480px;display:flex;flex-direction:column;justify-content:center;min-height:80vh}
header{text-align:center;margin-bottom:32px}
header h1{
  font-size:2.2rem;font-weight:700;
  background:linear-gradient(135deg,var(--accent),var(--purple));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;margin-bottom:6px;line-height:1.2;
}
header p{color:var(--text-secondary);font-size:1rem}

.cards{display:flex;flex-direction:column;gap:16px}
.card{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:var(--radius);padding:24px;
  text-decoration:none;color:var(--text);
  display:flex;align-items:center;gap:16px;
  transition:all .2s;cursor:pointer;
}
.card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 4px 20px rgba(78,204,163,.1)}
.card-icon{font-size:2.2rem;flex-shrink:0;width:48px;text-align:center}
.card-content{flex:1}
.card-title{font-size:1.1rem;font-weight:600;display:block;margin-bottom:4px}
.card-desc{font-size:0.8rem;color:var(--text-secondary);display:block}
.card-arrow{font-size:1.2rem;color:var(--text-secondary);flex-shrink:0}
.card:hover .card-arrow{color:var(--accent)}

@media(max-width:600px){
  body{padding:12px}
  header h1{font-size:1.8rem}
  .card{padding:18px}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Life Tracker</h1>
    <p>Выберите календарь</p>
  </header>
  <div class="cards">
    <a href="/sobriety" class="card">
      <span class="card-icon">&#127808;</span>
      <div class="card-content">
        <span class="card-title">Календарь трезвости</span>
        <span class="card-desc">Дни без алкоголя и никотина</span>
      </div>
      <span class="card-arrow">&rarr;</span>
    </a>
    <a href="/finance" class="card">
      <span class="card-icon">&#128176;</span>
      <div class="card-content">
        <span class="card-title">Финансовый менеджер</span>
        <span class="card-desc">Кредиты и платежи</span>
      </div>
      <span class="card-arrow">&rarr;</span>
    </a>
  </div>
  <div style="margin-top:40px;text-align:center">
    <span id="user-email" style="font-size:0.8rem;color:var(--text-secondary)"></span>
    <button id="logout-btn" style="display:block;margin:8px auto 0;background:transparent;border:1px solid var(--border);color:var(--text-secondary);padding:6px 16px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:0.8rem;transition:all .2s" onmouseover="this.style.borderColor='var(--text)'" onmouseout="this.style.borderColor=''">Выйти</button>
  </div>
</div>
<script>
const token = localStorage.getItem('token');
if (!token) { window.location.href = '/login'; }
try {
  const payload = JSON.parse(atob(token.split('.')[1]));
  document.getElementById('user-email').textContent = payload.email || '';
} catch(e) {}
document.getElementById('logout-btn').addEventListener('click', () => {
  localStorage.removeItem('token');
  window.location.href = '/login';
});
</script>
</body>
</html>
